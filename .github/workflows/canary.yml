name: Canary

# Runs the four fictional examples against the deployed contract every week
# and fails if a verdict changes. Can also be started by hand.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install genlayer-py==0.18.0
      - run: python tools/canary.py
